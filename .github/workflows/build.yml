name: Build AXMenu Rootless

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axmenu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS Rootless Debian Package
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      THEOS: ${{ github.workspace }}/theos
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bash \
            build-essential \
            ca-certificates \
            curl \
            file \
            fakeroot \
            git \
            lzma \
            make \
            perl \
            pkg-config \
            python3 \
            rsync \
            unzip \
            xz-utils \
            zlib1g-dev \
            libtinfo6 \
            libncurses6 \
            libxml2 \
            libz3-4 \
            dpkg-dev

          echo "========== SYSTEM =========="
          uname -a
          lsb_release -a || true

      - name: Install ldid from ProcursusTeam
        shell: bash
        run: |
          set -Eeuo pipefail

          RELEASE_API="https://api.github.com/repos/ProcursusTeam/ldid/releases/latest"

          curl \
            --fail \
            --show-error \
            --location \
            --retry 3 \
            --retry-all-errors \
            "$RELEASE_API" \
            --output "$RUNNER_TEMP/ldid-release.json"

          python3 - "$RUNNER_TEMP/ldid-release.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              release = json.load(f)

          assets = release.get("assets", [])
          candidates = [
              asset for asset in assets
              if "linux" in asset["name"].lower()
              and ("x86_64" in asset["name"].lower()
                   or "amd64" in asset["name"].lower())
              and not asset["name"].endswith((".sig", ".sha256"))
          ]

          if not candidates:
              print("Release assets:")
              for asset in assets:
                  print(asset["name"], asset["browser_download_url"])
              raise SystemExit("No Linux x86_64 ldid release asset found.")

          asset = candidates[0]
          print(asset["browser_download_url"])
          PY
          python3 - "$RUNNER_TEMP/ldid-release.json" > "$RUNNER_TEMP/ldid-url.txt" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              release = json.load(f)

          candidates = [
              asset for asset in release.get("assets", [])
              if "linux" in asset["name"].lower()
              and ("x86_64" in asset["name"].lower()
                   or "amd64" in asset["name"].lower())
              and not asset["name"].endswith((".sig", ".sha256"))
          ]

          if not candidates:
              raise SystemExit("No Linux x86_64 ldid asset found.")

          print(candidates[0]["browser_download_url"])
          PY

          LDID_URL="$(cat "$RUNNER_TEMP/ldid-url.txt")"

          curl \
            --fail \
            --show-error \
            --location \
            --retry 3 \
            --retry-all-errors \
            "$LDID_URL" \
            --output "$RUNNER_TEMP/ldid-download"

          test -s "$RUNNER_TEMP/ldid-download"

          if file "$RUNNER_TEMP/ldid-download" | grep -qi 'gzip compressed'; then
            gzip -dc "$RUNNER_TEMP/ldid-download" > "$RUNNER_TEMP/ldid"
          elif file "$RUNNER_TEMP/ldid-download" | grep -qi 'XZ compressed'; then
            xz -dc "$RUNNER_TEMP/ldid-download" > "$RUNNER_TEMP/ldid"
          elif file "$RUNNER_TEMP/ldid-download" | grep -qi 'tar archive'; then
            mkdir -p "$RUNNER_TEMP/ldid-extract"
            tar -xf "$RUNNER_TEMP/ldid-download" -C "$RUNNER_TEMP/ldid-extract"
            LDID_BIN="$(find "$RUNNER_TEMP/ldid-extract" -type f -name ldid -print -quit)"
            test -n "$LDID_BIN"
            install -m 0755 "$LDID_BIN" "$RUNNER_TEMP/ldid"
          else
            cp "$RUNNER_TEMP/ldid-download" "$RUNNER_TEMP/ldid"
          fi

          chmod +x "$RUNNER_TEMP/ldid"

          if ! file "$RUNNER_TEMP/ldid" | grep -q 'ELF'; then
            echo "::error::Downloaded ldid is not a Linux executable."
            file "$RUNNER_TEMP/ldid"
            exit 1
          fi

          sudo install -m 0755 "$RUNNER_TEMP/ldid" /usr/local/bin/ldid

          command -v ldid
          ldid -h

      - name: Install Theos
        shell: bash
        run: |
          set -Eeuo pipefail

          git clone \
            --depth 1 \
            --recurse-submodules \
            https://github.com/theos/theos.git \
            "$THEOS"

          test -f "$THEOS/makefiles/common.mk"

          mkdir -p \
            "$THEOS/toolchain/linux/iphone/bin" \
            "$THEOS/sdks"

          echo "========== THEOS REVISION =========="
          git -C "$THEOS" rev-parse HEAD

      - name: Install libtinfo5 compatibility library
        shell: bash
        run: |
          set -Eeuo pipefail

          if ldconfig -p | grep -q 'libtinfo\.so\.5'; then
            echo "libtinfo.so.5 already available."
            exit 0
          fi

          mkdir -p "$RUNNER_TEMP/libtinfo-compat"

          PACKAGE_URL="https://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.1_amd64.deb"

          curl \
            --fail \
            --show-error \
            --location \
            --retry 3 \
            --retry-all-errors \
            "$PACKAGE_URL" \
            --output "$RUNNER_TEMP/libtinfo5.deb"

          dpkg-deb --info "$RUNNER_TEMP/libtinfo5.deb"

          dpkg-deb -x \
            "$RUNNER_TEMP/libtinfo5.deb" \
            "$RUNNER_TEMP/libtinfo-compat"

          TINFO_LIB="$(find "$RUNNER_TEMP/libtinfo-compat" -type f -name 'libtinfo.so.5*' -print -quit)"

          if [[ -z "$TINFO_LIB" ]]; then
            echo "::error::libtinfo.so.5 was not found in the compatibility package."
            find "$RUNNER_TEMP/libtinfo-compat" -maxdepth 6 -type f -print
            exit 1
          fi

          sudo install -m 0644 "$TINFO_LIB" /usr/local/lib/libtinfo.so.5
          sudo ldconfig

          ldconfig -p | grep 'libtinfo\.so\.5'

      - name: Install Linux iOS toolchain
        shell: bash
        run: |
          set -Eeuo pipefail

          TOOLCHAIN_URL="https://github.com/sbingner/llvm-project/releases/latest/download/linux-ios-arm64e-clang-toolchain.tar.lzma"
          TOOLCHAIN_ARCHIVE="$RUNNER_TEMP/ios-toolchain.tar.lzma"
          TOOLCHAIN_EXTRACT="$RUNNER_TEMP/ios-toolchain-extract"

          mkdir -p "$TOOLCHAIN_EXTRACT"

          curl \
            --fail \
            --show-error \
            --location \
            --retry 3 \
            --retry-all-errors \
            "$TOOLCHAIN_URL" \
            --output "$TOOLCHAIN_ARCHIVE"

          test -s "$TOOLCHAIN_ARCHIVE"

          echo "========== TOOLCHAIN ARCHIVE =========="
          ls -lh "$TOOLCHAIN_ARCHIVE"
          file "$TOOLCHAIN_ARCHIVE"

          xz -t "$TOOLCHAIN_ARCHIVE"

          tar \
            --lzma \
            -xf "$TOOLCHAIN_ARCHIVE" \
            -C "$TOOLCHAIN_EXTRACT"

          CLANG_SOURCE="$(find "$TOOLCHAIN_EXTRACT" -type f -path '*/bin/clang' -print -quit)"

          if [[ -z "$CLANG_SOURCE" ]]; then
            echo "::error::clang was not found in the downloaded toolchain."
            find "$TOOLCHAIN_EXTRACT" -maxdepth 5 -type f -print
            exit 1
          fi

          TOOLCHAIN_ROOT="${CLANG_SOURCE%/bin/clang}"

          echo "Detected toolchain root: $TOOLCHAIN_ROOT"

          cp -a \
            "$TOOLCHAIN_ROOT/." \
            "$THEOS/toolchain/linux/iphone/"

          chmod +x "$THEOS/toolchain/linux/iphone/bin/clang"

          echo "========== TOOLCHAIN BIN =========="
          ls -la "$THEOS/toolchain/linux/iphone/bin/"

          echo "========== CLANG =========="
          "$THEOS/toolchain/linux/iphone/bin/clang" --version

      - name: Install iOS SDK
        shell: bash
        run: |
          set -Eeuo pipefail

          SDK_REPO="$RUNNER_TEMP/theos-sdks"
          SDK_NAME="iPhoneOS16.5.sdk"
          SDK_ARCHIVE="$RUNNER_TEMP/$SDK_NAME.tar.xz"
          SDK_EXTRACT="$RUNNER_TEMP/sdk-extract"

          git clone \
            --depth 1 \
            https://github.com/theos/sdks.git \
            "$SDK_REPO"

          SDK_SOURCE="$SDK_REPO/$SDK_NAME"

          if [[ ! -d "$SDK_SOURCE" ]]; then
            echo "SDK not found in repository checkout; fetching SDK release archive."

            SDK_RELEASE_API="https://api.github.com/repos/theos/sdks/releases/latest"

            curl \
              --fail \
              --show-error \
              --location \
              --retry 3 \
              --retry-all-errors \
              "$SDK_RELEASE_API" \
              --output "$RUNNER_TEMP/sdk-release.json"

            python3 - "$RUNNER_TEMP/sdk-release.json" "$SDK_NAME" > "$RUNNER_TEMP/sdk-url.txt" <<'PY'
          import json
          import sys

          release_file, sdk_name = sys.argv[1], sys.argv[2]

          with open(release_file, encoding="utf-8") as f:
              release = json.load(f)

          candidates = [
              asset for asset in release.get("assets", [])
              if sdk_name in asset["name"]
              and asset["name"].endswith((".tar.xz", ".tar.gz", ".zip"))
          ]

          if not candidates:
              for asset in release.get("assets", []):
                  print(asset["name"], asset["browser_download_url"])
              raise SystemExit(f"No release archive found for {sdk_name}")

          print(candidates[0]["browser_download_url"])
          PY

            SDK_URL="$(cat "$RUNNER_TEMP/sdk-url.txt")"

            curl \
              --fail \
              --show-error \
              --location \
              --retry 3 \
              --retry-all-errors \
              "$SDK_URL" \
              --output "$SDK_ARCHIVE"

            test -s "$SDK_ARCHIVE"

            SDK_SIZE="$(stat -c '%s' "$SDK_ARCHIVE")"

            echo "SDK archive size: $SDK_SIZE bytes"

            if [[ "$SDK_SIZE" -lt 10000000 ]]; then
              echo "::error::SDK archive is smaller than 10 MB."
              file "$SDK_ARCHIVE"
              exit 1
            fi

            mkdir -p "$SDK_EXTRACT"

            case "$SDK_URL" in
              *.tar.xz|*.tar.xz\?*)
                tar -xJf "$SDK_ARCHIVE" -C "$SDK_EXTRACT"
                ;;
              *.tar.gz|*.tar.gz\?*)
                tar -xzf "$SDK_ARCHIVE" -C "$SDK_EXTRACT"
                ;;
              *.zip|*.zip\?*)
                unzip -q "$SDK_ARCHIVE" -d "$SDK_EXTRACT"
                ;;
              *)
                echo "::error::Unsupported SDK archive format: $SDK_URL"
                exit 1
                ;;
            esac

            SDK_SOURCE="$(find "$SDK_EXTRACT" -type d -name "$SDK_NAME" -print -quit)"
          fi

          if [[ ! -d "$SDK_SOURCE" ]]; then
            echo "::error::The requested SDK was not found."
            find "$SDK_REPO" -maxdepth 3 -print
            exit 1
          fi

          test -f "$SDK_SOURCE/System/Library/Frameworks/Foundation.framework/Headers/Foundation.h"

          cp -a "$SDK_SOURCE" "$THEOS/sdks/"

          test -f "$THEOS/sdks/$SDK_NAME/System/Library/Frameworks/Foundation.framework/Headers/Foundation.h"

      - name: Verify build environment
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "========== THEOS =========="
          printf 'THEOS=%s\n' "$THEOS"
          test -f "$THEOS/makefiles/common.mk"

          echo "========== TOOLCHAIN BIN =========="
          ls -la "$THEOS/toolchain/linux/iphone/bin/"

          echo "========== CLANG LOCATIONS =========="
          find "$THEOS/toolchain" -name clang -type f -print

          echo "========== CLANG VERSION =========="
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"
          "$THEOS/toolchain/linux/iphone/bin/clang" --version

          echo "========== SDK DIRECTORY =========="
          ls -la "$THEOS/sdks/"

          echo "========== SDK SIZES =========="
          du -sh "$THEOS/sdks"/*

          echo "========== SDK VALIDATION =========="
          test -f "$THEOS/sdks/iPhoneOS16.5.sdk/System/Library/Frameworks/Foundation.framework/Headers/Foundation.h"

          echo "========== LDID =========="
          command -v ldid
          file "$(command -v ldid)"

          echo "========== PROJECT =========="
          ls -la
          test -f Makefile
          test -f control

      - name: Build rootless package
        shell: bash
        run: |
          set -Eeuo pipefail

          export THEOS="$GITHUB_WORKSPACE/theos"
          export PATH="$THEOS/toolchain/linux/iphone/bin:$PATH"

          make clean
          make package FINALPACKAGE=1

          echo "========== GENERATED DEB FILES =========="

          find packages -maxdepth 1 -type f -name '*.deb' -print

          if ! compgen -G 'packages/*.deb' > /dev/null; then
            echo "::error::No .deb package was produced."
            exit 1
          fi

          for package in packages/*.deb; do
            test -s "$package"
            dpkg-deb --info "$package"
          done

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: AXMenu-rootless-iphoneos-arm64
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 14