name: ax-build
on:
  push:
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: cache theos
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: theos-${{ runner.os }}

      - name: install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git make clang perl libssl-dev libplist-dev \
            libpng-dev libjpeg-dev fakeroot dpkg file xz-utils unzip wget
          curl -L -o /usr/local/bin/ldid \
            https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64 || true
          chmod +x /usr/local/bin/ldid || true
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> $GITHUB_ENV

      - name: clone theos
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/theos" ]; then
            git clone --recursive --depth 1 https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"
          fi

      - name: install toolchain
        run: |
          mkdir -p $THEOS/toolchain
          curl -L -o /tmp/tc.tar.xz \
            https://github.com/theos/toolchain/releases/download/linux/toolchain-linux-ubuntu22.04-x86_64.tar.xz || true
          tar -xf /tmp/tc.tar.xz -C $THEOS/toolchain || true
          ls -la $THEOS/toolchain/ || true

      - name: install ios sdk
        run: |
          mkdir -p $THEOS/sdks
          cd $THEOS/sdks
          # источник 1: iPhoneOS18.5 из xybp888 (zip)
          curl -L --retry 3 -o sdk.zip \
            "https://github.com/xybp888/iOS-SDKs/raw/master/iPhoneOS18.5.sdk.zip" || true
          SIZE=$(stat -c %s sdk.zip 2>/dev/null || echo 0)
          echo "source1 (18.5 zip) size: $SIZE"
          if [ "$SIZE" -gt 10000000 ]; then
            unzip -o sdk.zip || true
            rm -f sdk.zip
          else
            rm -f sdk.zip
            # источник 2: iPhoneOS18.5 из theos/sdks (tar.xz)
            curl -L --retry 3 -o sdk.tar.xz \
              "https://github.com/theos/sdks/raw/master/iPhoneOS18.5.sdk.tar.xz" || true
            SIZE=$(stat -c %s sdk.tar.xz 2>/dev/null || echo 0)
            echo "source2 (18.5 tar.xz) size: $SIZE"
            if [ "$SIZE" -gt 10000000 ]; then
              tar -xf sdk.tar.xz || true
              rm -f sdk.tar.xz
            else
              rm -f sdk.tar.xz
              # источник 3: fallback iPhoneOS16.5
              curl -L --retry 3 -o sdk.zip \
                "https://github.com/xybp888/iOS-SDKs/raw/master/iPhoneOS16.5.sdk.zip" || true
              SIZE=$(stat -c %s sdk.zip 2>/dev/null || echo 0)
              echo "source3 (16.5 zip) size: $SIZE"
              if [ "$SIZE" -gt 10000000 ]; then
                unzip -o sdk.zip || true
                rm -f sdk.zip
              fi
            fi
          fi
          echo "=== sdks dir ==="
          ls -la $THEOS/sdks/

      - name: list files
        run: |
          echo "=== root ==="
          ls -la
          echo "=== Resources ==="
          ls -la Resources/ || true
          echo "=== Makefile head ==="
          head -n 20 Makefile || true

      - name: build
        run: |
          make clean || true
          make package FINALPACKAGE=1 || true
          echo "=== packages dir ==="
          ls -la packages/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: AXMenu-deb
          path: packages/*.deb
          if-no-files-found: warn