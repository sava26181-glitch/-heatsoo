name: ax-build
on:
  push:
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git make clang llvm lld perl libssl-dev libplist-dev \
            libpng-dev libjpeg-dev fakeroot dpkg file xz-utils unzip wget zstd curl
          curl -L -o /usr/local/bin/ldid \
            https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64 || true
          chmod +x /usr/local/bin/ldid || true

      - name: install theos
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          mkdir -p $THEOS
          if [ ! -d "$THEOS/makefiles" ]; then
            git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS || true
          fi
          curl -fsSL https://raw.githubusercontent.com/theos/install/master/install.sh -o /tmp/install-theos.sh || true
          chmod +x /tmp/install-theos.sh || true
          THEOS=$THEOS bash /tmp/install-theos.sh || true
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "=== theos tree ==="
          ls -la $THEOS/ || true
          echo "=== toolchain check ==="
          find $THEOS/toolchain -name "clang" -type f 2>/dev/null | head -n 5 || true

      - name: install ios sdk from xybp888
        run: |
          mkdir -p $THEOS/sdks
          echo "=== cloning xybp888/iOS-SDKs ==="
          git clone --depth 1 https://github.com/xybp888/iOS-SDKs.git /tmp/xy-sdks || true
          cd /tmp/xy-sdks || true
          echo "=== repo contents ==="
          ls -la /tmp/xy-sdks/ || true
          echo "=== looking for .sdk dirs ==="
          find /tmp/xy-sdks -maxdepth 2 -type d -name "*.sdk" | head -n 10 || true
          # копируем все .sdk папки
          for d in $(find /tmp/xy-sdks -maxdepth 2 -type d -name "*.sdk"); do
            echo "copying $d"
            cp -r "$d" $THEOS/sdks/
          done
          echo "=== sdks dir ==="
          ls -la $THEOS/sdks/ || true
          du -sh $THEOS/sdks/* 2>/dev/null || true

      - name: install ios sdk (fallback)
        run: |
          if [ -z "$(ls -A $THEOS/sdks 2>/dev/null | grep sdk)" ]; then
            echo "no sdks yet, trying theos/sdks git clone"
            git clone --depth 1 https://github.com/theos/sdks.git /tmp/theos-sdks || true
            cd /tmp/theos-sdks || true
            ls -la
            for d in /tmp/theos-sdks/*.sdk; do
              [ -d "$d" ] && cp -r "$d" $THEOS/sdks/
            done
            echo "=== sdks after fallback ==="
            ls -la $THEOS/sdks/
            du -sh $THEOS/sdks/* || true
          else
            echo "sdks already present, skipping fallback"
          fi

      - name: build
        run: |
          make clean || true
          make package FINALPACKAGE=1 || true
          echo "=== packages dir ==="
          ls -la packages/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: AXMenu-deb
          path: packages/*.deb
          if-no-files-found: warn